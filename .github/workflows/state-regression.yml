name: State regression tests
on:
  push:
    branches: [fix/stale-appliance-state]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.9.0 pytest pytest-asyncio
      - name: Install the exact library declared by the integration
        run: |
          python - <<'PY'
          import json, subprocess, sys
          requirements = json.load(open('custom_components/hon/manifest.json'))['requirements']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *requirements])
          PY
      - run: python -m pytest -q
